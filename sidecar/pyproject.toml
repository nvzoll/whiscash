[project]
name = "whiscash-purge-sidecar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "pytest-asyncio>=1.0.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore:The default datetime adapter is deprecated as of Python 3.12:DeprecationWarning:aiosqlite",
]
