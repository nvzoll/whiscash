[project]
name = "whiscash-purge-sidecar"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
