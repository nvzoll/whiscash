[env]
_.file = { path = ".secrets.json", redact = true }
database_url = "postgresql+asyncpg://auth:auth@localhost:5432/auth"
redis_url = "redis://localhost:6379/0"

[tasks.start]
description = "Start docker compose"
run = "docker compose up --build -d --wait"

[tasks.drop-db]
description = "Drop the database"
run = '''
docker compose exec -T postgres psql -U auth -d postgres -c "DROP DATABASE IF EXISTS auth WITH (FORCE);"
'''

[tasks.create-db]
description = "Create the database"
run = '''
docker compose exec -T postgres psql -U auth -d postgres -c "CREATE DATABASE auth;"
'''

[tasks.migrate]
description = "Run migrations"
run = "uv run alembic upgrade head"

[tasks.uvr]
description = "Literally uv run"
run = "uv run"

[tasks.gen-secrets]
description = "Generate JWT secret"
dir = "cli"
run = "uv run cli.py secrets generate"

[tasks.create-service-key]
description = "Issue a new service-client API key (prints once)"
dir = "cli"
run = "uv run cli.py service-key new"

[tasks.revoke-service-key]
description = "Revoke a service-client API key by name"
dir = "cli"
run = "uv run cli.py service-key revoke"

[tasks.list-service-keys]
description = "List service-client API keys"
dir = "cli"
run = "uv run cli.py service-key list"
